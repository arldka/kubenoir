apiVersion: v1
kind: Pod
metadata:
  labels:
    app: full
  name: full
  namespace: default
spec:
  containers:
  - env:
    - name: POD_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: metadata.name
    - name: LIMIT
      valueFrom:
        resourceFieldRef:
          divisor: "0"
          resource: limits.memory
    image: registry.local:5000/team/app@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    imagePullPolicy: IfNotPresent
    lifecycle:
      preStop:
        httpGet:
          path: /drain
          port: 8080
          scheme: HTTP
    livenessProbe:
      failureThreshold: 3
      periodSeconds: 5
      successThreshold: 1
      tcpSocket:
        port: 8080
      timeoutSeconds: 1
    name: app
    ports:
    - containerPort: 8080
      hostPort: 8080
      protocol: TCP
    - containerPort: 9090
      hostPort: 9090
      protocol: UDP
    resources:
      limits:
        memory: 2Gi
      requests:
        cpu: 1m
        memory: 1M
    startupProbe:
      failureThreshold: 3
      grpc:
        port: 9090
        service: ""
      periodSeconds: 10
      successThreshold: 1
      timeoutSeconds: 1
    terminationMessagePath: /dev/termination-log
    terminationMessagePolicy: File
  - image: nginx:latest
    imagePullPolicy: Always
    name: latest
    resources: {}
    terminationMessagePath: /dev/termination-log
    terminationMessagePolicy: File
  dnsPolicy: ClusterFirst
  enableServiceLinks: true
  hostNetwork: true
  initContainers:
  - command:
    - sh
    - -c
    - "true"
    image: busybox
    imagePullPolicy: Always
    name: init
    resources: {}
    terminationMessagePath: /dev/termination-log
    terminationMessagePolicy: File
  restartPolicy: Always
  schedulerName: default-scheduler
  securityContext: {}
  terminationGracePeriodSeconds: 30
  volumes:
  - emptyDir: {}
    name: scratch
  - configMap:
      defaultMode: 420
      name: settings
    name: cfg
  - name: creds
    secret:
      defaultMode: 256
      secretName: creds
  - hostPath:
      path: /var/log
      type: ""
    name: host
  - downwardAPI:
      defaultMode: 420
      items:
      - fieldRef:
          apiVersion: v1
          fieldPath: metadata.labels
        path: labels
    name: info
  - name: token
    projected:
      defaultMode: 420
      sources:
      - serviceAccountToken:
          expirationSeconds: 3600
          path: token
      - downwardAPI:
          items:
          - fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
            path: name
  - emptyDir:
      sizeLimit: 512Mi
    name: limited
