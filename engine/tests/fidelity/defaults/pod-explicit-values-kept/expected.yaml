apiVersion: v1
kind: Pod
metadata:
  name: kept
  namespace: default
spec:
  containers:
  - image: app
    imagePullPolicy: Never
    name: app
    readinessProbe:
      exec:
        command:
        - cat
        - /ready
      failureThreshold: 1
      periodSeconds: 10
      successThreshold: 1
      timeoutSeconds: 3
    resources: {}
    terminationMessagePath: /dev/termination-log
    terminationMessagePolicy: FallbackToLogsOnError
  dnsPolicy: Default
  enableServiceLinks: false
  restartPolicy: Never
  schedulerName: custom
  securityContext:
    runAsUser: 1000
  terminationGracePeriodSeconds: 5
