apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: default
spec:
  containers:
    - name: app
      image: shop:1.0
      ports:
        - containerPort: 8080
      resources:
        limits:
          cpu: "0.5"
          memory: 128Mi
      readinessProbe:
        httpGet:
          port: 8080
