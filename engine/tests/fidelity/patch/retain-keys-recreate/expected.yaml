apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
      - env:
        - name: DB_HOST
          value: db
        image: shop:1.0
        name: app
