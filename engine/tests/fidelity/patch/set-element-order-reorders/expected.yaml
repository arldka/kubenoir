apiVersion: v1
kind: Pod
metadata:
  finalizers:
  - a
  - b
  labels:
    app: shop
    tier: front
  name: web
spec:
  containers:
  - image: proxy:2
    name: sidecar
  - args:
    - --port
    - "8080"
    env:
    - name: A
      value: "1"
    - name: B
      value: "2"
    image: shop:1.2
    name: app
    ports:
    - containerPort: 8080
      name: http
    volumeMounts:
    - mountPath: /cache
      name: cache
  securityContext:
    fsGroup: 2000
    runAsUser: 1000
  tolerations:
  - key: dedicated
    operator: Exists
  volumes:
  - emptyDir: {}
    name: cache
