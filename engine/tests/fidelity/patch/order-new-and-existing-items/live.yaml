apiVersion: v1
kind: Pod
metadata:
  name: web
  labels:
    app: shop
    tier: front
  finalizers: [a, b]
spec:
  containers:
    - name: app
      image: shop:1.0
      args: [--port, "8080"]
      ports:
        - containerPort: 8080
          name: http
      env:
        - name: A
          value: "1"
        - name: B
          value: "2"
      volumeMounts:
        - name: cache
          mountPath: /cache
    - name: sidecar
      image: proxy:2
  volumes:
    - name: cache
      emptyDir: {}
  tolerations:
    - key: dedicated
      operator: Exists
  securityContext:
    runAsUser: 1000
    fsGroup: 2000
