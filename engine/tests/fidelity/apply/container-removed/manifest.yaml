apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  labels:
    app: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
      - name: app
        image: shop:1.0
        env:
        - name: DB_HOST
          value: db
        - name: MODE
          value: prod
        ports:
        - containerPort: 8080
      volumes:
      - name: cache
        emptyDir: {}
