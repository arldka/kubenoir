[package]
name = "engine"
version = "0.1.0"
edition = "2021"
description = "Simulated Kubernetes control plane for the K8s detective game, compiled to WASM"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
k8s-openapi = { version = "0.28", features = ["v1_36"] }
# Runs the template container apps (`apps/`, built for wasm32-wasip1) inside the engine.
# `grep` for the terminal's shell. Unicode case folding and \w \d \s only; no other tables.
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
wasmi = { version = "2", default-features = false, features = ["std", "validate", "auto-dispatch"] }

[[bin]]
# Checks scenario files against the local apps; see `docs/registry.md`.
name = "scenario-check"
required-features = ["bundled-apps"]

[features]
default = ["bundled-apps"]
# Embed the locally built template apps (`../apps`) for native tests and tools. The browser
# build turns it off and is given its apps by an app registry instead.
bundled-apps = []

[dev-dependencies]
wat = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rusqlite = "0.41"
# rusqlite pulls this in without default features; the `wasm-bindgen` feature supplies the
# host hooks (clock, randomness, sleep) that SQLite needs at link time.
sqlite-wasm-rs = { version = "0.6", features = ["wasm-bindgen"] }

[profile.release]
opt-level = "s"
lto = true
