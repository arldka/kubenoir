name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting, lints and the engine's and template apps' tests. Mirrors `make lint` and the
  # Rust half of `make test`.
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo fmt --manifest-path engine/Cargo.toml --check
      - run: cargo fmt --all --manifest-path apps/Cargo.toml --check
      - run: cargo clippy --manifest-path engine/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --manifest-path apps/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path engine/Cargo.toml
      - run: cargo test --manifest-path apps/Cargo.toml

  # Upstream fidelity goldens: regenerates them with upstream Kubernetes (oracle/, Go) and fails
  # if they differ from the checked-in ones. Mirrors `make fidelity`.
  fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: oracle/go.mod
          cache-dependency-path: oracle/go.sum
      - run: make fidelity

  # Builds the engine to WASM and the local registry (apps + scenarios, checked) once; the frontend
  # jobs reuse both. Mirrors `make wasm` and `make registry`.
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: wasm
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: oven-sh/setup-bun@v2
      - run: wasm-pack build engine --target web --out-dir ../frontend/src/lib/wasm --no-default-features
      - run: cargo build --manifest-path apps/Cargo.toml --release --target wasm32-wasip1
      - run: cargo run -q --manifest-path engine/Cargo.toml --bin scenario-check -- scenarios/*/scenario.json
      - run: bun scripts/build-registry.ts
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: frontend/src/lib/wasm
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: registry
          path: frontend/static/registry
          retention-days: 3

  # Types, unit tests (including the terminal against a headless xterm) and the production build.
  # Mirrors `make check`, the frontend half of `make test`, and `make build`.
  frontend:
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: frontend/src/lib/wasm
      - uses: actions/download-artifact@v4
        with:
          name: registry
          path: frontend/static/registry
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build

  # Plays the game in a real browser. Mirrors `make e2e`.
  e2e:
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: frontend/src/lib/wasm
      - uses: actions/download-artifact@v4
        with:
          name: registry
          path: frontend/static/registry
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: frontend/test-results
          retention-days: 7

  # Live demo: publishes the production build to a Cloudflare Worker (static assets, no script)
  # once every other job has passed on main. Needs the CLOUDFLARE_API_TOKEN and
  # CLOUDFLARE_ACCOUNT_ID repository secrets.
  deploy:
    needs: [engine, fidelity, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://kubenoir.arldka.cloud
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: frontend/src/lib/wasm
      - uses: actions/download-artifact@v4
        with:
          name: registry
          path: frontend/static/registry
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          wranglerVersion: "4.156.0"
          command: deploy
