apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: default
  labels:
    app: payments-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
      - name: payments-api
        image: registry.example.com/payments-api:2.4.1
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: '8080'
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
        - name: DATABASE_URL
          value: postgres://payments:$(DB_PASSWORD)@postgres:5432/payments
