apiVersion: v1
kind: Pod
metadata:
  name: postgres
  namespace: default
  labels:
    app: postgres
spec:
  containers:
  - name: postgres
    image: postgres:16
    ports:
    - name: sql
      containerPort: 5432
    env:
    - name: POSTGRES_USER
      value: payments
    - name: POSTGRES_DB
      value: payments
    - name: POSTGRES_PASSWORD
      value: correct-horse
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: default
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: sql
